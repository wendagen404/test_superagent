<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#e8ecf1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#10161d" media="(prefers-color-scheme: dark)">
  <meta name="description" content="test_superagent 的欢迎页：一个用来试工单的公开测试仓库。">
  <title>test_superagent · 欢迎</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20fill='%23fbfaf6'/%3E%3Crect%20x='3'%20y='3'%20width='26'%20height='26'%20fill='none'%20stroke='%23c04232'%20stroke-width='3'/%3E%3Ctext%20x='16'%20y='22'%20font-family='Georgia,serif'%20font-size='16'%20font-style='italic'%20text-anchor='middle'%20fill='%2316202a'%3Eh%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light dark;
      --bench: #e8ecf1;
      --grid: rgba(22, 32, 42, 0.05);
      --glow: rgba(255, 255, 255, 0.55);
      --wash-blue: rgba(41, 82, 191, 0.06);
      --wash-gold: rgba(227, 164, 20, 0.08);
      --paper: #fbfaf6;
      --ink: #16202a;
      --muted: #5b6a78;
      --line: rgba(22, 32, 42, 0.16);
      --perf: rgba(22, 32, 42, 0.3);
      --stamp: #bb3a1c;
      --stamp-opacity: 0.82;
      --chip-ring: rgba(22, 32, 42, 0.12);
      --blue: #2952bf;
      --green: #0b7a58;
      --gold: #b98500;
      --red: #bb3a1c;
      --purple: #7d49c8;
      --fill-blue: #3f6be0;
      --fill-green: #12a377;
      --fill-gold: #e3a414;
      --fill-red: #e0512c;
      --fill-purple: #8a55d6;
      --shadow: 0 32px 64px -32px rgba(18, 28, 38, 0.35), 0 4px 12px rgba(18, 28, 38, 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bench: #10161d;
        --grid: rgba(255, 255, 255, 0.045);
        --glow: rgba(120, 150, 180, 0.07);
        --wash-blue: rgba(120, 155, 235, 0.07);
        --wash-gold: rgba(235, 180, 60, 0.05);
        --paper: #19212a;
        --ink: #e9eff5;
        --muted: #9dabb8;
        --line: rgba(255, 255, 255, 0.12);
        --perf: rgba(255, 255, 255, 0.26);
        --stamp: #f58c6b;
        --stamp-opacity: 0.72;
        --chip-ring: rgba(255, 255, 255, 0.14);
        --blue: #9db9f5;
        --green: #56d3a3;
        --gold: #ecc25e;
        --red: #f58c6b;
        --purple: #b795ea;
        --shadow: 0 32px 64px -32px rgba(0, 0, 0, 0.65), 0 4px 12px rgba(0, 0, 0, 0.25);
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(20px, 5vw, 56px);
      background-color: var(--bench);
      background-image:
        radial-gradient(680px 420px at 50% 32%, var(--glow), transparent 70%),
        radial-gradient(560px 420px at 10% 92%, var(--wash-blue), transparent 72%),
        radial-gradient(620px 460px at 92% 6%, var(--wash-gold), transparent 72%),
        linear-gradient(to right, var(--grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
      background-size: auto, auto, auto, 48px 48px, 48px 48px;
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      line-height: 1.6;
    }

    ::selection {
      background: rgba(187, 58, 28, 0.2);
    }

    .ticket {
      position: relative;
      width: min(100%, 880px);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: clamp(28px, 5.5vw, 64px);
      box-shadow: var(--shadow);
    }

    .head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: clamp(16px, 3vw, 32px);
    }

    .repo {
      margin: 0;
      font-family: "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.4;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .stamp {
      flex: none;
      width: clamp(92px, 12vw, 132px);
      aspect-ratio: 5 / 4;
      display: grid;
      place-content: center;
      gap: 2px;
      text-align: center;
      border: 3px solid var(--stamp);
      border-radius: 6px;
      outline: 1px solid var(--stamp);
      outline-offset: -9px;
      color: var(--stamp);
      opacity: var(--stamp-opacity);
      mix-blend-mode: multiply;
      transform: rotate(8deg);
      font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      user-select: none;
    }

    @media (prefers-color-scheme: dark) {
      .stamp {
        mix-blend-mode: normal;
      }
    }

    .stamp strong {
      font-size: clamp(12px, 1.6vw, 17px);
      font-weight: 600;
      letter-spacing: 0.16em;
    }

    .stamp span {
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
      font-size: clamp(11px, 1.3vw, 14px);
      letter-spacing: 0.32em;
      text-indent: 0.32em;
    }

    .hero {
      margin: clamp(20px, 3.5vw, 32px) 0 0;
      font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, "Songti SC", SimSun, serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(64px, 15vw, 148px);
      line-height: 0.85;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .hero .p span {
      display: inline-block;
    }

    .hero .p span:nth-child(1) { color: var(--blue);   rotate: -1.4deg; }
    .hero .p span:nth-child(2) { color: var(--green);  rotate: 1.2deg; }
    .hero .p span:nth-child(3) { color: var(--gold);   rotate: -1deg; }
    .hero .p span:nth-child(4) { color: var(--red);    rotate: 1.4deg; }
    .hero .p span:nth-child(5) { color: var(--purple); rotate: -1.2deg; }
    .hero .p span:nth-child(6) { color: var(--red); }

    .lead {
      margin: clamp(24px, 4vw, 40px) 0 0;
      max-width: 26em;
      font-size: clamp(20px, 2.4vw, 24px);
      font-weight: 600;
      line-height: 1.55;
      text-wrap: pretty;
    }

    .sub {
      margin: 8px 0 0;
      max-width: 32em;
      color: var(--muted);
      font-size: clamp(15px, 1.7vw, 17px);
      line-height: 1.7;
      text-wrap: pretty;
    }

    .palette {
      margin: clamp(26px, 4vw, 40px) 0 0;
    }

    .palette ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 16px 22px;
    }

    .sw {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 7px;
    }

    .chip {
      width: clamp(58px, 7vw, 74px);
      height: clamp(42px, 5vw, 52px);
      border-radius: 12px 12px 5px 5px;
      box-shadow: inset 0 0 0 1px var(--chip-ring);
    }

    .sw-blue .chip   { background: var(--fill-blue); }
    .sw-green .chip  { background: var(--fill-green); }
    .sw-gold .chip   { background: var(--fill-gold); }
    .sw-red .chip    { background: var(--fill-red); }
    .sw-purple .chip { background: var(--fill-purple); }

    .sw-name {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      line-height: 1;
    }

    .sw-hex {
      font-family: "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      line-height: 1;
      letter-spacing: 0.03em;
      color: var(--muted);
    }

    .links {
      margin-top: clamp(30px, 4.5vw, 48px);
      padding-top: clamp(18px, 3vw, 28px);
      border-top: 1px dashed var(--perf);
      display: flex;
      flex-wrap: wrap;
      gap: 12px clamp(24px, 5vw, 48px);
      font-size: 15px;
    }

    .links a {
      position: relative;
      padding-left: 15px;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-decoration-color: color-mix(in srgb, currentColor 45%, transparent);
      text-underline-offset: 5px;
      transition: text-decoration-color 0.15s ease;
    }

    .links a::before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      width: 9px;
      height: 9px;
      margin-top: -4.5px;
      border-radius: 50%;
      background: currentColor;
    }

    .links a.l-repo   { color: var(--blue); }
    .links a.l-issues { color: var(--red); }
    .links a.l-readme { color: var(--green); }

    .links a:hover {
      text-decoration-thickness: 2px;
      text-decoration-color: currentColor;
    }

    .links a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 4px;
      border-radius: 1px;
    }

    @media (prefers-reduced-motion: no-preference) {
      .ticket {
        animation: card-in 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }

      .hero .p span {
        animation: letter-in 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }

      .hero .p span:nth-child(1) { animation-delay: 0.1s; }
      .hero .p span:nth-child(2) { animation-delay: 0.15s; }
      .hero .p span:nth-child(3) { animation-delay: 0.2s; }
      .hero .p span:nth-child(4) { animation-delay: 0.25s; }
      .hero .p span:nth-child(5) { animation-delay: 0.3s; }
      .hero .p span:nth-child(6) { animation-delay: 0.35s; }

      .stamp {
        animation: stamp-in 0.4s 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.3) both;
      }
    }

    @keyframes card-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
    }

    @keyframes letter-in {
      from {
        opacity: 0;
        transform: translateY(0.09em);
      }
    }

    @keyframes stamp-in {
      from {
        transform: rotate(8deg) scale(1.18);
        opacity: 0;
      }

      to {
        transform: rotate(8deg) scale(1);
        opacity: var(--stamp-opacity);
      }
    }

    @media (max-width: 420px) {
      .stamp {
        width: 84px;
        outline-offset: -7px;
      }

      .palette ul {
        gap: 12px 16px;
      }

      .links {
        gap: 10px 20px;
      }
    }
  </style>
</head>
<body>
  <main class="ticket">
    <header class="head">
      <p class="repo">test_superagent</p>
      <div class="stamp" aria-hidden="true">
        <strong>WELCOME</strong>
        <span>欢迎</span>
      </div>
    </header>

    <h1 class="hero" aria-label="hello.">
      <span class="p" aria-hidden="true"><span>h</span><span>e</span><span>l</span><span>l</span><span>o</span><span>.</span></span>
    </h1>

    <p class="lead">欢迎来到这个公开的测试仓库。</p>
    <p class="sub">提一个需求，看看 superagent 会把它做成什么样。</p>

    <section class="palette" aria-label="本页的五支颜料">
      <ul>
        <li class="sw sw-blue"><span class="chip" aria-hidden="true"></span><span class="sw-name">群青</span><span class="sw-hex">#3F6BE0</span></li>
        <li class="sw sw-green"><span class="chip" aria-hidden="true"></span><span class="sw-name">湖绿</span><span class="sw-hex">#12A377</span></li>
        <li class="sw sw-gold"><span class="chip" aria-hidden="true"></span><span class="sw-name">藤黄</span><span class="sw-hex">#E3A414</span></li>
        <li class="sw sw-red"><span class="chip" aria-hidden="true"></span><span class="sw-name">朱砂</span><span class="sw-hex">#E0512C</span></li>
        <li class="sw sw-purple"><span class="chip" aria-hidden="true"></span><span class="sw-name">茄紫</span><span class="sw-hex">#8A55D6</span></li>
      </ul>
    </section>

    <nav class="links" aria-label="仓库链接">
      <a class="l-repo" href="https://github.com/wendagen404/test_superagent">GitHub 仓库</a>
      <a class="l-issues" href="https://github.com/wendagen404/test_superagent/issues">Issues</a>
      <a class="l-readme" href="README.md">README</a>
    </nav>
  </main>
</body>
</html>
